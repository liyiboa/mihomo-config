name: Update Rule Files

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download rules from blackmatrix7
        run: |
          GH="https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash"
          curl -sL -o rule_provider/Telegram.list "$GH/Telegram/Telegram.list"
          curl -sL -o rule_provider/TikTok.list "$GH/TikTok/TikTok.list"
          curl -sL -o rule_provider/AI.list "$GH/OpenAI/OpenAI.list"
          curl -sL -o rule_provider/AppleAccount.list "$GH/Apple/Apple.list"
          curl -sL -o rule_provider/AppStore.list "$GH/AppStore/AppStore.list"
          curl -sL -o rule_provider/GitHub.list "$GH/GitHub/GitHub.list"
          curl -sL -o rule_provider/Netflix.list "$GH/Netflix/Netflix.list"
          curl -sL -o rule_provider/YouTube.list "$GH/YouTube/YouTube.list"
          curl -sL -o rule_provider/Disney.list "$GH/Disney/Disney.list"
          curl -sL -o rule_provider/Twitter.list "$GH/Twitter/Twitter.list"
          curl -sL -o rule_provider/Facebook.list "$GH/Facebook/Facebook.list"
          curl -sL -o rule_provider/Instagram.list "$GH/Instagram/Instagram.list"
          curl -sL -o rule_provider/Spotify.list "$GH/Spotify/Spotify.list"
          curl -sL -o rule_provider/Google.list "$GH/Google/Google.list"
          curl -sL -o rule_provider/OneDrive.list "$GH/OneDrive/OneDrive.list"

      - name: Download other rules
        run: |
          curl -sL -o rule_provider/Steam.list \
            "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Ruleset/Steam.list"
          curl -sL -o rule_provider/LAN_SPLITTER.list \
            "https://fastly.jsdelivr.net/gh/fmz200/wool_scripts@main/Loon/rule/LAN.list"
          curl -sL -o rule_provider/mihomo.mrs \
            "https://fastly.jsdelivr.net/gh/privacy-protection-tools/anti-ad.github.io@master/docs/mihomo.mrs"

      - name: Validate
        run: |
          for f in rule_provider/*; do
            size=$(wc -c < "$f")
            echo "  $f ($size bytes)"
            [ "$size" -gt 100 ] || { echo "ERROR: $f too small"; exit 1; }
          done

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
            exit 0
          fi
          git commit -m "Auto update rule files $(date '+%Y-%m-%d %H:%M')"
          git push
